<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101216" id="theme-color-meta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koers">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Valuta omrekenen — GENES//MEDIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Dark-first — GENES//MEDIA huisstijl */
    --bg-app:#101216;--bg-panel:#14171d;--bg-card:#191d25;--bg-input:#12151b;
    --bg-chip:#1b1f27;--bg-hover:#232834;--bg-active:#1a2733;
    --text-primary:#e6e8ee;--text-secondary:#9aa0ad;--text-muted:#6a6e77;--faint:#565a63;
    --border:#22262f;--border-card:#242935;--border-input:#262b36;
    --accent:#2590ce;--accent-soft:#5fb5e6;--accent-tint:rgba(37,144,206,.14);
    --amber:#f0d080;--amber-bg:#2a2310;--amber-border:#5c4d1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 20px 50px -24px rgba(0,0,0,.7);
    --mono:"IBM Plex Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  }
  body.light{
    --bg-app:#eef0f3;--bg-panel:#ffffff;--bg-card:#ffffff;--bg-input:#f2f3f6;
    --bg-chip:#eef0f3;--bg-hover:#e7eaef;--bg-active:#e7f3fa;
    --text-primary:#1c1e24;--text-secondary:#555962;--text-muted:#858994;--faint:#9aa0ad;
    --border:#dfe2e8;--border-card:#e4e6ea;--border-input:#d5d8df;
    --accent-tint:rgba(37,144,206,.1);
    --amber:#8a6410;--amber-bg:#fbf3dd;--amber-border:#e7cf86;
    --shadow:0 1px 2px rgba(25,27,23,.04),0 14px 40px -20px rgba(25,27,23,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg-app);color:var(--text-primary);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
    display:flex;flex-direction:column}

  /* ═══ TOPBAR ═══ */
  .topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
  .topbar .logo{font-family:var(--disp);font-weight:800;font-size:19px;
    letter-spacing:.02em;text-transform:uppercase;color:var(--text-primary);white-space:nowrap}
  .topbar .logo .slash{color:var(--accent)}
  .topbar .app-sub{font-size:10px;color:var(--text-muted);text-transform:uppercase;
    letter-spacing:.08em;border-left:1px solid var(--border);padding-left:14px;white-space:nowrap}
  .topbar .spacer{margin-left:auto}
  .theme-toggle{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg-chip);color:var(--text-secondary);cursor:pointer;font-size:15px;
    display:grid;place-items:center;transition:background .15s,border-color .15s,color .15s}
  .theme-toggle:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--accent)}
  .theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .theme-icon-dark{display:none}
  body:not(.light) .theme-icon-light{display:none}
  body:not(.light) .theme-icon-dark{display:inline}

  /* ═══ LAYOUT ═══ */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px}
  .card{width:100%;max-width:440px;background:var(--bg-panel);border:1px solid var(--border-card);
    border-radius:18px;box-shadow:var(--shadow);overflow:visible}
  .card-h{padding:22px 26px 18px;border-bottom:1px solid var(--border);display:flex;
    align-items:baseline;justify-content:space-between;gap:12px}
  .card-title{font-family:var(--disp);font-weight:700;font-size:1.35rem;text-transform:uppercase;
    letter-spacing:.03em}
  .card-title .dot{color:var(--accent)}
  .status{font-family:var(--mono);font-size:.7rem;color:var(--faint);letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pip{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;transition:background .3s}
  .pip.live{background:var(--accent)}
  .pip.pulse{animation:pulse .9s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,144,206,.45)}100%{box-shadow:0 0 0 7px rgba(37,144,206,0)}}

  .body{padding:22px 26px 8px}
  .row{border:1px solid var(--border-input);border-radius:12px;padding:14px 16px;display:flex;
    align-items:center;gap:14px;background:var(--bg-card);transition:border-color .15s,box-shadow .15s}
  .row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:3px}

  /* ═══ CURRENCY PICKER ═══ */
  .picker{flex:none;min-width:0;position:relative}
  .cur-btn{display:flex;align-items:center;gap:6px;border:none;background:transparent;
    font-family:var(--mono);font-weight:600;font-size:1.15rem;color:var(--text-primary);
    padding:2px 0;cursor:pointer;outline:none}
  .cur-btn .caret{width:10px;height:6px;flex:none;transition:transform .18s}
  .cur-btn .caret path{stroke:var(--text-muted)}
  .picker.open .cur-btn .caret{transform:rotate(180deg)}
  .cur-name{font-size:.68rem;color:var(--faint);margin-top:2px;max-width:160px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur-pop{position:absolute;top:calc(100% + 8px);left:-8px;z-index:30;width:270px;
    background:var(--bg-panel);border:1px solid var(--border-card);border-radius:12px;
    box-shadow:var(--shadow);padding:8px;display:none;flex-direction:column;gap:8px}
  .picker.open .cur-pop{display:flex}
  .cur-search-wrap{position:relative}
  .cur-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;pointer-events:none}
  .cur-search-wrap svg path,.cur-search-wrap svg circle{stroke:var(--text-muted)}
  .cur-search{width:100%;border:1px solid var(--border-input);background:var(--bg-input);
    border-radius:9px;padding:9px 10px 9px 32px;color:var(--text-primary);
    font-family:"Inter",sans-serif;font-size:.85rem;outline:none}
  .cur-search::placeholder{color:var(--text-muted)}
  .cur-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .cur-list{list-style:none;margin:0;padding:0;max-height:240px;overflow-y:auto;
    display:flex;flex-direction:column;gap:2px}
  .cur-list li{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;
    cursor:pointer;transition:background .1s}
  .cur-list li .li-code{font-family:var(--mono);font-weight:600;font-size:.85rem;
    color:var(--text-primary);flex:none;width:42px}
  .cur-list li .li-name{font-size:.82rem;color:var(--text-secondary);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .cur-list li:hover,.cur-list li.active{background:var(--bg-hover)}
  .cur-list li[aria-selected="true"]{background:var(--accent-tint)}
  .cur-list li[aria-selected="true"] .li-code{color:var(--accent-soft)}
  .cur-empty{padding:14px 10px;text-align:center;font-size:.82rem;color:var(--text-muted)}

  .amt{flex:1;min-width:0;text-align:right}
  .amt input{width:100%;border:none;background:transparent;outline:none;text-align:right;
    font-family:var(--mono);font-weight:500;font-size:1.5rem;color:var(--text-primary);padding:0}
  .amt input::placeholder{color:var(--faint)}

  .swap{display:flex;justify-content:center;margin:-9px 0;position:relative;z-index:5}
  .swap button{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-input);
    background:var(--bg-panel);color:var(--accent);cursor:pointer;display:grid;place-items:center;
    transition:transform .35s cubic-bezier(.4,1.3,.5,1),background .15s,border-color .15s}
  .swap button:hover{background:var(--accent-tint);border-color:var(--accent)}
  .swap button:active{transform:rotate(180deg) scale(.94)}
  .swap button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .swap.turn button{transform:rotate(180deg)}

  .result-row{margin-top:6px;border:1px solid var(--border-input);border-radius:12px;padding:16px;
    background:var(--bg-card);display:flex;align-items:center;gap:14px}
  .out{flex:1;text-align:right;font-family:var(--mono);font-weight:600;font-size:2rem;
    letter-spacing:-.01em;color:var(--text-primary);min-width:0;overflow:hidden;
    text-overflow:ellipsis;transition:opacity .18s}
  .result-row.loading .out{opacity:.35}

  .meta{padding:16px 26px 24px;display:flex;flex-direction:column;gap:4px}
  .rate-line{font-family:var(--mono);font-size:.82rem;color:var(--text-primary)}
  .rate-line .rate{color:var(--accent-soft);font-weight:500}
  .sub{font-size:.72rem;color:var(--text-muted)}
  .sub a{color:var(--accent-soft)}
  .note{margin-top:8px;font-size:.72rem;color:var(--amber);background:var(--amber-bg);
    border:1px solid var(--amber-border);border-radius:8px;padding:8px 10px;display:none}
  .note.show{display:block}
  .banner{margin:0 26px 20px;font-size:.76rem;line-height:1.45;color:var(--amber);
    background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:10px;
    padding:11px 13px;display:none}
  .banner.show{display:block}
  .banner b{color:var(--text-primary)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">GENES<span class="slash">//</span>MEDIA</div>
    <div class="app-sub">Valuta omrekenen</div>
    <div class="spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="Wissel thema" aria-label="Wissel licht/donker thema">
      <span class="theme-icon-light">☀</span>
      <span class="theme-icon-dark">☾</span>
    </button>
  </div>

  <div class="stage">
  <main class="card" role="application" aria-label="Valuta omrekenen">
    <div class="card-h">
      <div class="card-title">Koers<span class="dot">.</span></div>
      <div class="status"><span class="pip" id="pip"></span><span id="statusText">laden…</span></div>
    </div>
    <div class="body">
      <div class="row">
        <div class="picker" id="fromPicker">
          <div class="lbl">Van</div>
          <button type="button" class="cur-btn" id="fromBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="cur-code" id="fromCode">—</span>
            <svg class="caret" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="cur-name" id="fromName"></div>
          <div class="cur-pop" id="fromPop" role="dialog" aria-label="Kies valuta">
            <div class="cur-search-wrap">
              <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke-width="1.5" stroke-linecap="round"/></svg>
              <input type="text" class="cur-search" id="fromSearch" placeholder="Zoek valuta…" aria-label="Zoek valuta" autocomplete="off">
            </div>
            <ul class="cur-list" id="fromList" role="listbox" aria-label="Van valuta"></ul>
          </div>
        </div>
        <div class="amt">
          <label class="lbl" for="amount" style="display:block">Bedrag</label>
          <input id="amount" type="text" inputmode="decimal" value="4500" aria-label="Bedrag">
        </div>
      </div>
      <div class="swap" id="swapWrap">
        <button id="swap" aria-label="Wissel valuta om" title="Wissel om">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 3v10M4 3L1.5 5.5M4 3l2.5 2.5M12 13V3M12 13l2.5-2.5M12 13l-2.5-2.5"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="result-row" id="resultRow">
        <div class="picker" id="toPicker">
          <div class="lbl">Naar</div>
          <button type="button" class="cur-btn" id="toBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="cur-code" id="toCode">—</span>
            <svg class="caret" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="cur-name" id="toName"></div>
          <div class="cur-pop" id="toPop" role="dialog" aria-label="Kies valuta">
            <div class="cur-search-wrap">
              <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke-width="1.5" stroke-linecap="round"/></svg>
              <input type="text" class="cur-search" id="toSearch" placeholder="Zoek valuta…" aria-label="Zoek valuta" autocomplete="off">
            </div>
            <ul class="cur-list" id="toList" role="listbox" aria-label="Naar valuta"></ul>
          </div>
        </div>
        <div class="out" id="output" aria-live="polite">—</div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="meta">
      <div class="rate-line" id="rateLine">&nbsp;</div>
      <div class="sub" id="updated">&nbsp;</div>
      <div class="note" id="weekendNote">Let op: de ECB publiceert koersen alleen op werkdagen rond 16:00 CET. In het weekend zie je de laatste koers van vrijdag.</div>
      <div class="sub" style="margin-top:10px">Bron: Europese Centrale Bank via <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter</a></div>
    </div>
  </main>
  </div>
<script>
// Ingebouwde valutalijst (ECB-set) — zodat de keuzemenu's ALTIJD werken,
// ook als de API even onbereikbaar is.
const FALLBACK = {
  AUD:"Australische dollar",BGN:"Bulgaarse lev",BRL:"Braziliaanse real",CAD:"Canadese dollar",
  CHF:"Zwitserse frank",CNY:"Chinese yuan",CZK:"Tsjechische kroon",DKK:"Deense kroon",
  EUR:"Euro",GBP:"Britse pond",HKD:"Hongkongse dollar",HUF:"Hongaarse forint",
  IDR:"Indonesische roepia",ILS:"Israëlische sjekel",INR:"Indiase roepie",ISK:"IJslandse kroon",
  JPY:"Japanse yen",KRW:"Zuid-Koreaanse won",MXN:"Mexicaanse peso",MYR:"Maleisische ringgit",
  NOK:"Noorse kroon",NZD:"Nieuw-Zeelandse dollar",PHP:"Filipijnse peso",PLN:"Poolse zloty",
  RON:"Roemeense leu",SEK:"Zweedse kroon",SGD:"Singaporese dollar",THB:"Thaise baht",
  TRY:"Turkse lira",USD:"Amerikaanse dollar",ZAR:"Zuid-Afrikaanse rand"
};
// Meerdere endpoints — als de één geblokkeerd is, probeer de volgende.
const HOSTS = ["https://api.frankfurter.dev/v1","https://api.frankfurter.app/v1"];

const el = id => document.getElementById(id);
const fmtCache = {};
let currencies = {}, rates = {}, rateDate = null, apiOk = false;
let fromCur = "KRW", toCur = "EUR";

// Zoek-hulp: verwijder accenten zodat "israel" ook "Israëlische" vindt.
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function nfFor(cur){
  if(!fmtCache[cur]){
    try{fmtCache[cur]=new Intl.NumberFormat("nl-NL",{style:"currency",currency:cur,maximumFractionDigits:2});}
    catch(e){fmtCache[cur]=new Intl.NumberFormat("nl-NL",{maximumFractionDigits:2});}
  }
  return fmtCache[cur];
}
function parseAmount(s){
  if(!s) return NaN;
  return parseFloat(s.replace(/\s/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
}
function setStatus(t,live){el("statusText").textContent=t;el("pip").classList.toggle("live",!!live);}
function pulse(){const p=el("pip");p.classList.remove("pulse");void p.offsetWidth;p.classList.add("pulse");}
function showBanner(html){el("banner").innerHTML=html;el("banner").classList.add("show");}

// ── Eigen valutakiezer met zoekfunctie + volledige namen ──────────────
function makePicker(key, getVal, setVal){
  const pk=el(key+"Picker"), btn=el(key+"Btn"), pop=el(key+"Pop"),
        search=el(key+"Search"), list=el(key+"List");
  let items=[];   // huidige (gefilterde) opties
  let active=-1;  // gemarkeerde rij voor toetsenbord

  function render(filter){
    const q=norm(filter);
    const codes=Object.keys(currencies).sort();
    items=codes.filter(c=> !q || norm(c).includes(q) || norm(currencies[c]).includes(q));
    if(!items.length){ list.innerHTML='<li class="cur-empty" role="presentation">Geen valuta gevonden</li>'; active=-1; return; }
    list.innerHTML=items.map((c,i)=>
      `<li role="option" data-code="${c}" data-i="${i}" aria-selected="${c===getVal()}">`
      +`<span class="li-code">${c}</span><span class="li-name">${currencies[c]}</span></li>`).join("");
    active=Math.max(0, items.indexOf(getVal()));
    highlight();
  }
  function highlight(){
    [...list.querySelectorAll("li[role=option]")].forEach((li,i)=>{
      li.classList.toggle("active", i===active);
      if(i===active) li.scrollIntoView({block:"nearest"});
    });
  }
  function open(){
    pk.classList.add("open"); btn.setAttribute("aria-expanded","true");
    search.value=""; render(""); search.focus();
  }
  function close(){ pk.classList.remove("open"); btn.setAttribute("aria-expanded","false"); }
  function toggle(){ pk.classList.contains("open") ? close() : open(); }
  function choose(code){ if(!code) return; setVal(code); close(); }

  btn.addEventListener("click", toggle);
  search.addEventListener("input", ()=>render(search.value));
  list.addEventListener("mousedown", e=>{
    const li=e.target.closest("li[role=option]"); if(!li) return;
    e.preventDefault(); choose(li.dataset.code);
  });
  search.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown"){e.preventDefault(); if(items.length){active=(active+1)%items.length;highlight();}}
    else if(e.key==="ArrowUp"){e.preventDefault(); if(items.length){active=(active-1+items.length)%items.length;highlight();}}
    else if(e.key==="Enter"){e.preventDefault(); if(active>=0&&items[active]) choose(items[active]);}
    else if(e.key==="Escape"){e.preventDefault(); close(); btn.focus();}
  });
  return {open,close,render};
}

let fromPicker, toPicker;
// Onthoud het gekozen valutapaar, zodat de app voortaan opent met JOUW
// combinatie in plaats van altijd KRW → EUR.
function saveDefault(){
  try{ localStorage.setItem("koers-pair", JSON.stringify({from:fromCur,to:toCur})); }catch(e){}
}
function setFrom(c){ fromCur=c; syncPicker("from"); saveDefault(); convert(); }
function setTo(c){ toCur=c; syncPicker("to"); saveDefault(); convert(); }
function syncPicker(key){
  const val = key==="from" ? fromCur : toCur;
  el(key+"Code").textContent = val;
  el(key+"Name").textContent = currencies[val] || "";
}

// Sluit open kiezers bij klik buiten.
document.addEventListener("click", e=>{
  ["fromPicker","toPicker"].forEach(id=>{
    const pk=el(id); if(pk && !pk.contains(e.target)) pk.classList.remove("open");
  });
  document.querySelectorAll(".picker .cur-btn").forEach(b=>b.setAttribute("aria-expanded","false"));
});

function relDate(d){
  if(!d) return "";
  return new Date(d+"T16:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
}

// Probeer elk endpoint tot er één werkt.
async function apiGet(path){
  let lastErr;
  for(const host of HOSTS){
    try{
      const r = await fetch(host+path,{mode:"cors"});
      if(r.ok) return await r.json();
      lastErr = new Error(host+" "+r.status);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("geen endpoint bereikbaar");
}

async function loadRates(base){
  if(rates[base]) return;
  const data = await apiGet("/latest?base="+encodeURIComponent(base));
  rates[base] = data.rates; rates[base][base] = 1; rateDate = data.date;
}

async function convert(){
  const from=fromCur, to=toCur, amt=parseAmount(el("amount").value);
  if(!from||!to) return;
  el("resultRow").classList.add("loading");
  try{
    await loadRates(from);
    apiOk = true; setStatus("live",true);
    el("banner").classList.remove("show");
    if(isNaN(amt)){el("output").textContent="—";el("rateLine").innerHTML="&nbsp;";return;}
    const rate = rates[from][to];
    el("output").textContent = nfFor(to).format(amt*rate);
    const rateStr = rate>=1 ? rate.toLocaleString("nl-NL",{maximumFractionDigits:4}) : rate.toPrecision(4);
    el("rateLine").innerHTML = `1 ${from} = <span class="rate">${rateStr} ${to}</span>`;
    el("updated").textContent = "Koers van "+relDate(rateDate);
    pulse();
  }catch(err){
    setStatus("offline",false);
    el("output").textContent="—"; el("rateLine").innerHTML="&nbsp;";
    el("updated").textContent="";
    showBanner('<b>Geen verbinding met de koers-API.</b> De valutalijst werkt wel, maar omrekenen lukt pas met internettoegang. Werkt dit binnen de chat-preview niet? <b>Download het bestand en open het in je browser</b> — dan werkt het meestal wél.');
  }finally{
    el("resultRow").classList.remove("loading");
  }
}

// ── Thema (donker-first, keuze onthouden) ──
const themeToggle = el("theme-toggle");
function applyTheme(t){ document.body.classList.toggle("light", t==="light");
  el("theme-color-meta") && (el("theme-color-meta").content = t==="light" ? "#eef0f3" : "#101216"); }
(function initTheme(){
  let saved; try{ saved=localStorage.getItem("koers-theme"); }catch(e){}
  applyTheme(saved || "dark");
})();
themeToggle.addEventListener("click", ()=>{
  const light = !document.body.classList.contains("light");
  applyTheme(light ? "light" : "dark");
  try{ localStorage.setItem("koers-theme", light ? "light" : "dark"); }catch(e){}
});

el("amount").addEventListener("input",()=>{clearTimeout(window._d);window._d=setTimeout(convert,200);});
el("swap").addEventListener("click",()=>{
  const f=fromCur; fromCur=toCur; toCur=f;
  syncPicker("from"); syncPicker("to"); saveDefault();
  el("swapWrap").classList.toggle("turn"); convert();
});

async function init(){
  setStatus("laden…",false);
  // 1) Vul met de ingebouwde lijst — nooit meer leeg.
  currencies = {...FALLBACK};
  fromPicker = makePicker("from", ()=>fromCur, setFrom);
  toPicker   = makePicker("to",   ()=>toCur,   setTo);
  // Laad een eerder opgeslagen standaardpaar (valt anders terug op KRW → EUR).
  try{
    const saved = JSON.parse(localStorage.getItem("koers-pair")||"null");
    if(saved && saved.from) fromCur = saved.from;
    if(saved && saved.to)   toCur   = saved.to;
  }catch(e){}
  if(!currencies[fromCur]) fromCur = currencies.KRW ? "KRW" : Object.keys(currencies)[0];
  if(!currencies[toCur])   toCur   = currencies.EUR ? "EUR" : Object.keys(currencies)[0];
  syncPicker("from"); syncPicker("to");
  if([0,6].includes(new Date().getDay())) el("weekendNote").classList.add("show");
  // 2) Probeer de live namenlijst op te halen (verbetert alleen labels).
  try{
    const live = await apiGet("/currencies");
    if(live && Object.keys(live).length){ currencies = live; syncPicker("from"); syncPicker("to"); }
  }catch(e){ /* fallback blijft staan */ }
  // 3) Reken om.
  await convert();
}
init();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
